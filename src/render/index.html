<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Wallet Profit</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 16px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .muted { color:#666; font-size:12px; margin-bottom:10px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 12px; align-items:center; }
    textarea { width: 100%; height: 220px; padding: 10px; font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    button { padding: 10px 14px; border: 0; border-radius: 10px; cursor: pointer; }
    button.primary { background:#111; color:#fff; }
    button.secondary { background:#eee; }
    .pill { display:inline-flex; gap:8px; align-items:center; padding:6px 10px; border-radius:999px; background:#f2f2f2; font-size:12px; }
    .stats { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 12px; }
    .stat { padding: 8px 10px; border-radius: 12px; background:#fafafa; border:1px solid #eee; font-size:12px; }
    .stat b { font-variant-numeric: tabular-nums; }
    .error { color:#b00020; white-space:pre-wrap; font-size:12px; margin:8px 0; }
    
    .wrap { overflow:auto; max-height: calc(100vh - 300px); border:1px solid #eee; border-radius: 12px; }

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed; /* IMPORTANT */
}

th, td {
  border-bottom: 1px solid #e6e6e6;
  padding: 8px;
  font-size: 12px;
  text-align: left;
  vertical-align: middle;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

th {
  position: sticky;
  top: 0;
  background: #fafafa;
  z-index: 2;
}

td.num, th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.view-btn { padding: 8px 12px; border-radius: 12px; background:#eee; cursor:pointer; }
    .inp { width: 120px; padding:6px; border:1px solid #ddd; border-radius:8px; font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 12px; }

    /* Menu Styles */
    .menu-bar {
      display: flex;
      gap: 8px;
      margin: 16px 0;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      flex-wrap: wrap;
    }

    .menu-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .menu-group label {
      font-size: 12px;
      font-weight: 600;
      color: #495057;
      margin-right: 4px;
    }

    .menu-btn {
      padding: 8px 12px;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .menu-btn:hover {
      background: #e9ecef;
      border-color: #adb5bd;
    }

    .menu-btn.active {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }

    .menu-btn.primary {
      background: #007bff;
      color: white;
      border-color: #007bff;
    }

    .menu-btn.danger {
      background: #dc3545;
      color: white;
      border-color: #dc3545;
    }

    .menu-separator {
      width: 1px;
      height: 24px;
      background: #dee2e6;
      margin: 0 8px;
    }

    /* Modal */
    .hidden { display:none !important; }
    .modal-backdrop { position:fixed; inset:0; background: rgba(0,0,0,0.35); }
    .modal { position:fixed; left:50%; top:50%; transform: translate(-50%, -50%);
      width:min(560px, calc(100vw - 32px)); background:#fff; border-radius: 14px;
      box-shadow: 0 16px 60px rgba(0,0,0,0.25); border: 1px solid rgba(0,0,0,0.08);
    }
    .modal-header { display:flex; align-items:center; justify-content:space-between; padding:12px 12px 0 12px; }
    .modal-header h3 { margin:0; font-size:14px; }
    .modal-body { padding: 12px; display:flex; flex-direction:column; gap: 8px; }
    .modal-body label { font-size:12px; color:#444; }
    .modal-body input { width:100%; padding:10px; border:1px solid #ddd; border-radius:10px; font-size:12px; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top: 8px; }
    .hint { font-size:12px; color:#666; margin-top: 6px; }
.columns-panel {
  display: none;
  position: absolute;
  right: 16px;
  top: 132px;
  z-index: 20;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  padding: 10px;
  min-width: 220px;
}
.columns-panel.open { display: block; }
.columns-panel label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  margin: 6px 0;
}
  </style>
</head>
<body>
  <!-- Wallet Settings Modal -->
  <div id="walletModalBackdrop" class="modal-backdrop hidden"></div>

  <div id="walletModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3>Wallet Settings</h3>
      <button id="btnWalletClose" class="secondary">✕</button>
    </div>

    <div class="modal-body">
      <label>Base URL</label>
      <input id="inpBaseUrl" type="text" placeholder="https://dashboard.toters-api.com" />

      <label>Store ID</label>
      <input id="inpStoreId" type="text" placeholder="100908" />

      <label>Wallet</label>
      <input id="inpWallet" type="text" placeholder="main" />

      <label>Bearer Token</label>
      <input id="inpToken" type="password" placeholder="Paste token here" />

      <label>Exchange Rate (1 USD = ? LBP)</label>
      <input id="inpUsdToLbpRate" type="number" placeholder="90000" step="1000" />

      <label>Display Currency</label>
      <select id="selDisplayCurrency">
        <option value="USD">USD ($)</option>
        <option value="LBP">LBP (L.L)</option>
      </select>

      <div class="modal-actions">
        <button id="btnWalletSave" class="primary">Save</button>
        <button id="btnWalletCancel" class="secondary">Cancel</button>
      </div>

      <div id="walletModalMsg" class="hint"></div>
    </div>
  </div>

  <h1>Wallet Profit (Ops)</h1>
  <div class="muted">
    Transaction data is synced automatically from the wallet API. Use the menu below to manage operations.
  </div>

  <div id="status" class="muted"></div>

  <!-- Menu Bar -->
  <div class="menu-bar">
    <div class="menu-group">
      <label>Data:</label>
      <button class="menu-btn" id="btnRefresh">Refresh</button>
      <button class="menu-btn" id="btnExportCsv">Export CSV</button>
    </div>

    <div class="menu-separator"></div>

    <div class="menu-group">
      <label>Wallet:</label>
      <button class="menu-btn" id="btnWalletSettings">Settings</button>
      <button class="menu-btn primary" id="btnWalletSync">Sync</button>
    </div>

    <div class="menu-separator"></div>

    <div class="menu-group">
      <label>Sales:</label>
      <input class="inp" type="date" id="salesFrom" style="margin-right: 4px;" />
      <span style="font-size: 12px; margin-right: 4px;">to</span>
      <input class="inp" type="date" id="salesTo" style="margin-right: 8px;" />
      <button class="menu-btn" id="btnGenerateSales">Report</button>
      <button class="menu-btn" id="btnExportSalesExcel">Export Excel</button>
      <button class="menu-btn" id="btnSyncSales">Sync Orders</button>
    </div>

    <div class="menu-separator"></div>

    <div class="menu-group">
      <label>Views:</label>
      <button class="menu-btn" id="btnProducts">Products</button>
      <button class="menu-btn" id="btnRevenueDashboard">Dashboard</button>
      <button class="menu-btn" id="btnDbAdmin">DB Admin</button>
    </div>

    <div class="menu-separator"></div>

    <div class="menu-group">
      <label>Options:</label>
      <label class="pill">
        <input type="checkbox" id="chkSettlements" />
        Include Settlements
      </label>
      <select id="selPaidFilter" class="inp" style="margin-left: 8px;">
        <option value="all">All</option>
        <option value="paid">Paid only</option>
        <option value="unpaid">Not paid</option>
      </select>
      <select id="selCurrencyDisplay" class="inp" style="margin-left: 8px;">
        <option value="USD">USD</option>
        <option value="LBP">LBP</option>
      </select>
      <button class="menu-btn" id="btnColumns">Columns</button>
      <button class="menu-btn danger" id="btnResetSupplier">Reset Costs</button>
    </div>
  </div>

  <div id="columnsPanel" class="columns-panel"></div>

  <div class="error" id="err"></div>

  <div class="stats" id="stats"></div>

  <div class="wrap">
    <table id="table">
      <thead>
        <tr>
          <th data-col="view"></th>
          <th data-col="order">Order</th>
          <th class="num" data-col="gross">Gross</th>
          <th class="num" data-col="service">Service</th>
          <th class="num" data-col="vat">VAT</th>
          <th class="num" data-col="incentive">Incentive</th>
          <th class="num" data-col="merchant_payout">Merchant Payout</th>
          <th class="num" data-col="toters_margin">Toters Margin</th>
          <th class="num" data-col="supplier_cost">Supplier Cost</th>
          <th data-col="paid">Paid</th>
          <th class="num" data-col="net_profit">Net Profit</th>
          <th class="num" data-col="rows">Rows</th>
          <th data-col="dates">Dates</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
