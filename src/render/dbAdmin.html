<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DB Tables</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 16px; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    select, button, input { padding: 6px 10px; border-radius: 8px; border:1px solid #ddd; font-size:12px; }
    button.danger { background:#b00020; color:#fff; border-color:#b00020; }
    button.secondary { background:#eee; }
    .muted { font-size:12px; color:#666; margin-top:4px; }
    table { width:max-content; min-width:100%; border-collapse:collapse; font-size:12px; table-layout:auto; }
    th, td { padding:6px 10px; border-bottom:1px solid #eee; white-space:nowrap; min-width:140px; }
    th { background:#fafafa; position:sticky; top:0; z-index:1; }
    .wrap { max-height:600px; overflow:auto; border:1px solid #eee; border-radius:10px; }
    .columns-panel {
      display: none;
      position: absolute;
      right: 16px;
      top: 120px;
      z-index: 20;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 10px;
      min-width: 240px;
      max-height: 360px;
      overflow: auto;
    }
    .columns-panel.open { display: block; }
    .columns-panel label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin: 6px 0;
    }
    .supplier-panel {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 10px;
    }
    .supplier-panel.open { display: flex; }
    .supplier-panel input { min-width: 220px; }
    .msg-ok { color: #155724; font-size: 12px; }
    .msg-err { color: #b00020; font-size: 12px; }
    td input.supplier-name {
      width: 100%;
      min-width: 160px;
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
    }
    .actions { display: flex; gap: 6px; }
    .actions button { padding: 4px 8px; font-size: 11px; }
  </style>
</head>
<body>
  <h2>Database Tables</h2>
  <div class="row">
    <label>
      Table
      <select id="selTable"></select>
    </label>
    <label>
      Search
      <input id="inpSearch" type="text" placeholder="Filter current table rows" />
    </label>
    <button id="btnReload" class="secondary">Reload</button>
    <button id="btnColumns" class="secondary">Columns</button>
    <button id="btnClear" class="danger">Delete all rows in table</button>
  </div>
  <div id="columnsPanel" class="columns-panel"></div>

  <div id="supplierPanel" class="supplier-panel row">
    <strong>Suppliers</strong>
    <label>
      Name
      <input id="inpSupplierName" type="text" placeholder="Supplier name" />
    </label>
    <label>
      Color
      <input id="inpSupplierColor" type="color" value="#dbeafe" />
    </label>
    <label>
      Phone
      <input id="inpSupplierPhone" type="text" placeholder="WhatsApp phone" />
    </label>
    <button id="btnAddSupplier">Add Supplier</button>
    <span id="supplierMsg"></span>
  </div>

  <div id="info" class="muted"></div>

  <div class="wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    const selTable = $("selTable");
    const info = $("info");
    const thead = $("thead");
    const tbody = $("tbody");
    const inpSearch = $("inpSearch");
    const btnColumns = $("btnColumns");
    const columnsPanel = $("columnsPanel");
    const supplierPanel = $("supplierPanel");
    const inpSupplierName = $("inpSupplierName");
    const inpSupplierColor = $("inpSupplierColor");
    const inpSupplierPhone = $("inpSupplierPhone");
    const btnAddSupplier = $("btnAddSupplier");
    const supplierMsg = $("supplierMsg");
    let allRows = [];
    let tableColumns = [];
    let visibleColumns = [];

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setSupplierMsg(text, isError) {
      supplierMsg.textContent = text || "";
      supplierMsg.className = isError ? "msg-err" : "msg-ok";
    }

    function updateSupplierPanel() {
      const isSuppliers = selTable.value === "suppliers";
      supplierPanel.classList.toggle("open", isSuppliers);
      if (!isSuppliers) setSupplierMsg("");
    }

    function renderColumnsPanel() {
      columnsPanel.innerHTML = tableColumns
        .map((col) => {
          const checked = visibleColumns.includes(col) ? "checked" : "";
          return `<label><input type="checkbox" data-col-check="${escapeHtml(col)}" ${checked} /> ${escapeHtml(col)}</label>`;
        })
        .join("");

      columnsPanel.querySelectorAll("input[data-col-check]").forEach((chk) => {
        chk.addEventListener("change", () => {
          const next = Array.from(columnsPanel.querySelectorAll("input[data-col-check]"))
            .filter((x) => x.checked)
            .map((x) => x.getAttribute("data-col-check"));
          if (!next.length) {
            chk.checked = true;
            return;
          }
          visibleColumns = next;
          renderRows();
        });
      });
    }

    function rowMatchesSearch(row, query) {
      if (!query) return true;
      const q = query.toLowerCase();
      return visibleColumns.some((col) => String(row[col] ?? "").toLowerCase().includes(q));
    }

    function wireSupplierRowActions() {
      tbody.querySelectorAll("[data-save-supplier]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const tr = btn.closest("tr");
          const id = Number(tr.getAttribute("data-id"));
          const name = tr.querySelector(".supplier-name").value.trim();
          const color = tr.querySelector("[data-edit-color]")?.value || "#e8f4fc";
          const phone = tr.querySelector(".supplier-phone")?.value?.trim() || "";
          if (!name) {
            setSupplierMsg("Supplier name cannot be empty", true);
            return;
          }
          const res = await window.api.suppliersUpdate({ id, name, color, phone });
          if (res?.ok === false) {
            setSupplierMsg(res.error || "Failed to update supplier", true);
            return;
          }
          setSupplierMsg("Supplier updated.");
          await loadTable();
        });
      });

      tbody.querySelectorAll("[data-delete-supplier]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const tr = btn.closest("tr");
          const id = Number(tr.getAttribute("data-id"));
          const name = tr.querySelector(".supplier-name").value;
          if (!confirm(`Delete supplier "${name}"?\nOrders using it will become unassigned.`)) return;
          await window.api.suppliersDelete(id);
          setSupplierMsg("Supplier deleted.");
          await loadTable();
        });
      });
    }

    function renderSupplierRows() {
      const query = inpSearch.value.trim().toLowerCase();
      const visibleRows = allRows.filter((r) => {
        if (!query) return true;
        return String(r.name ?? "").toLowerCase().includes(query)
          || String(r.id ?? "").includes(query);
      });

      thead.innerHTML = "<tr><th>id</th><th>color</th><th>name</th><th>phone</th><th>created_at</th><th>Actions</th></tr>";
      tbody.innerHTML = visibleRows.map((r) => `
        <tr data-id="${r.id}">
          <td>${r.id}</td>
          <td><input type="color" data-edit-color value="${escapeHtml(r.color || "#e8f4fc")}" /></td>
          <td><input class="supplier-name" type="text" value="${escapeHtml(r.name)}" /></td>
          <td><input class="supplier-phone" type="text" value="${escapeHtml(r.phone || "")}" placeholder="Phone" /></td>
          <td>${escapeHtml(r.created_at)}</td>
          <td class="actions">
            <button data-save-supplier>Save</button>
            <button data-delete-supplier class="danger">Delete</button>
          </td>
        </tr>
      `).join("");

      wireSupplierRowActions();

      const suffix = query ? ` | Filtered: ${visibleRows.length}` : "";
      info.textContent = `suppliers: ${allRows.length} rows (showing max 200)${suffix}`;
    }

    function renderRows() {
      if (selTable.value === "suppliers") {
        renderSupplierRows();
        return;
      }

      const query = inpSearch.value.trim();
      const visibleRows = allRows.filter((r) => rowMatchesSearch(r, query));

      if (!tableColumns.length) {
        thead.innerHTML = "";
        tbody.innerHTML = "";
        info.textContent = selTable.value + ": 0 rows (showing max 200)";
        return;
      }

      thead.innerHTML = "<tr>" + visibleColumns.map(c => "<th>" + escapeHtml(c) + "</th>").join("") + "</tr>";
      tbody.innerHTML = visibleRows.map(r => {
        return "<tr>" + visibleColumns.map(c => "<td>" + escapeHtml(r[c]) + "</td>").join("") + "</tr>";
      }).join("");

      const suffix = query ? ` | Filtered: ${visibleRows.length}` : "";
      info.textContent = `${selTable.value}: ${allRows.length} rows (showing max 200)${suffix}`;
    }

    async function loadTables() {
      const tables = await window.api.dbListTables();
      const current = selTable.value;
      selTable.innerHTML = (tables || [])
        .map((t) => `<option value="${t}">${t}</option>`)
        .join("");
      if (!tables || !tables.length) {
        throw new Error("No tables found");
      }
      selTable.value = tables.includes(current) ? current : tables[0];
    }

    async function loadTable() {
      const table = selTable.value;
      updateSupplierPanel();
      info.textContent = "Loading " + table + "…";
      thead.innerHTML = "";
      tbody.innerHTML = "";
      allRows = [];
      tableColumns = [];

      try {
        const rows = await window.api.dbGetTable(table, 200);
        allRows = rows || [];

        if (table === "suppliers") {
          renderSupplierRows();
          return;
        }

        if (!allRows.length) {
          info.textContent = table + ": 0 rows (showing max 200)";
          return;
        }

        tableColumns = Object.keys(allRows[0]);
        visibleColumns = [...tableColumns];
        renderColumnsPanel();
        renderRows();
      } catch (e) {
        info.textContent = "Error: " + String(e);
      }
    }

    $("btnReload").addEventListener("click", loadTable);

    $("btnClear").addEventListener("click", async () => {
      const table = selTable.value;
      if (!confirm("Delete ALL rows from '" + table + "'?\nThis cannot be undone.")) return;
      try {
        info.textContent = "Clearing " + table + "…";
        await window.api.dbClearTable(table);
        await loadTable();
      } catch (e) {
        info.textContent = "Error: " + String(e);
      }
    });

    btnAddSupplier.addEventListener("click", async () => {
      const name = inpSupplierName.value.trim();
      if (!name) {
        setSupplierMsg("Enter a supplier name", true);
        return;
      }
      const res = await window.api.suppliersCreate({
        name,
        color: inpSupplierColor.value,
        phone: inpSupplierPhone.value.trim(),
      });
      if (res?.ok === false) {
        setSupplierMsg(res.error || "Failed to add supplier", true);
        return;
      }
      inpSupplierName.value = "";
      setSupplierMsg(`Supplier "${name}" added.`);
      await loadTable();
    });

    inpSupplierName.addEventListener("keydown", (e) => {
      if (e.key === "Enter") btnAddSupplier.click();
    });

    selTable.addEventListener("change", loadTable);
    inpSearch.addEventListener("input", renderRows);
    btnColumns.addEventListener("click", () => {
      columnsPanel.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
      if (!columnsPanel.classList.contains("open")) return;
      if (columnsPanel.contains(e.target) || e.target === btnColumns) return;
      columnsPanel.classList.remove("open");
    });

    (async () => {
      try {
        await loadTables();
        await loadTable();
      } catch (e) {
        info.textContent = "Error: " + String(e);
      }
    })();
  </script>
</body>
</html>
